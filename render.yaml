services:
  - type: web
    name: modelx-poc
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: MARKET_DATA_PROVIDER
        value: upstox
      - key: BROKER_API_KEY
        sync: false
      - key: BROKER_API_SECRET
        sync: false
      - key: BROKER_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: krishjain2607@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_SENDER
        value: krishjain2607@gmail.com
      - key: ALERT_FROM_EMAIL
        value: krishjain2607@gmail.com
      - key: ALERT_TO_EMAIL
        value: krishjain2607@gmail.com,sakshigairola65@gmail.com
      - key: PUBLIC_BASE_URL
        value: https://modelx-poc.onrender.com
      - key: APPROVAL_SECRET
        sync: false
      - key: EXECUTION_GATEWAY_URL
        sync: false
      - key: EXECUTION_GATEWAY_SECRET
        sync: false
      - key: EXECUTION_GATEWAY_TIMEOUT_SECONDS
        value: "15"
