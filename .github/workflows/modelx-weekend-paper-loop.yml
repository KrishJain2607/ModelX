name: ModelX Weekend Paper Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * 0,6"

permissions:
  contents: read

concurrency:
  group: modelx-weekend-paper-loop
  cancel-in-progress: false

jobs:
  weekend-paper-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake Render and run bounded weekend paper cycle
        env:
          MODELX_URL: https://modelx-poc.onrender.com
          MODELX_AUTOMATION_SECRET: ${{ secrets.MODELX_AUTOMATION_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MODELX_AUTOMATION_SECRET"

          curl --fail-with-body --show-error --silent             --retry 6 --retry-delay 15 --retry-max-time 240             --connect-timeout 20 --max-time 300             --request POST             --header "X-ModelX-Automation-Secret: $MODELX_AUTOMATION_SECRET"             "$MODELX_URL/api/automation/paper-monitor"

          curl --fail-with-body --show-error --silent             --retry 6 --retry-delay 15 --retry-max-time 240             --connect-timeout 20 --max-time 300             --request POST             --header "X-ModelX-Automation-Secret: $MODELX_AUTOMATION_SECRET"             "$MODELX_URL/api/automation/daily-scan"
